name: PR body

# PR 本文を読む検査だけをここへ分離する。ci.yml 側から edited を外してあるため、
# 委任証拠コメントの差し替えで 1 時間の backend/harness がキャンセルされない。
# concurrency も ci.yml とは別グループにして、本文編集が重い検査へ影響しないようにする。
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-body-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 必須チェック名 ``core-guard`` は従来どおり維持する。
  core-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.13"
          enable-cache: true
          prune-cache: true
      - run: uv python install
      - run: uv run python scripts/core_guard.py

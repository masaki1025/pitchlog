[project]
name = "pitchlog-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.2",
    "fastapi[standard]==0.141.1",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = [
    "anyio==4.14.2",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "ty==0.0.73",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
# D415 は日本語の句点「。」を要約行の終端記号として認識しないため除外する。
ignore = ["D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.fastapi]
entrypoint = "pitchlog.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_db: PostgreSQL 17.11 への実接続を必須とするテスト",
    "frozen_negative: 凍結基準への不正な変更が red になることを検証する負例",
]
